services:
  bot:
    image: ghcr.io/breno-hof/heroes-theme-bot:latest
    build: .
    restart: unless-stopped
    environment:
      HT_DISCORD_TOKEN: ${HT_DISCORD_TOKEN}
      HT_LOG_LEVEL: ${HT_LOG_LEVEL:-INFO}
    ports:
      - "8765:8765"
    volumes:
      - heroes-theme-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  heroes-theme-data:
