[project]
name = "heroes-theme-bot"
version = "0.1.0"
description = "Discord voice bridge for Hero's Theme: reports who is speaking to connected VTT clients."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.14"
dependencies = [
    "discord.py[voice]>=2.7.1,<3",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.16,<3",
    "structlog>=26.1",
    "websockets>=17.4,<18",
]

[project.scripts]
heroes-theme-bot = "heroes_theme_bot.main:main"

[dependency-groups]
dev = [
    "jsonschema>=4.25",
    "mypy>=1.19",
    "pytest>=9",
    "pytest-asyncio>=1.3",
    "ruff>=0.14",
    "types-jsonschema",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
