name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Audit dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt -o requirements.audit.txt
          # discord.py pins PyNaCl<1.6, which bundles a libsodium with an Ed25519 point-validation
          # flaw (fixed in PyNaCl 1.6.2). The bot never calls that API: it only reads RTP headers.
          # Drop these two ignores once discord.py lifts the pin.
          uvx pip-audit --requirement requirements.audit.txt --require-hashes --disable-pip \
            --ignore-vuln PYSEC-2026-1448 --ignore-vuln PYSEC-2026-3002

      - name: Check tag matches pyproject.toml version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(uv version --short)"
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::tag $TAG does not match pyproject.toml version $version"; exit 1
          fi

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push with the job-scoped GITHUB_TOKEN; no stored secret
      id-token: write # OIDC identity for the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=sha,format=short

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull requests build the image to prove the Dockerfile works, but never push.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
